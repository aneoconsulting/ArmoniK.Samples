name: Scan image
description: >
  Scan a container image for vulnerabilities with Trivy and upload the JSON
  report as the artifact trivy-<name>, for the trivyReport job that summarizes
  every image. Annotates fixable vulnerabilities of the blocking severities
  and, when enforced, fails on them.

inputs:
  image:
    description: Image archive (a `docker save` or Jib tar) or image reference to scan
    required: true
  name:
    description: Image name, used for the report file and artifact
    required: true
  enforce:
    description: Fail when fixable vulnerabilities of the blocking severities are found
    required: false
    default: "false"
  severities:
    description: Comma-separated blocking severities
    required: false
    default: HIGH,CRITICAL

runs:
  using: composite
  steps:
    - name: Set up Trivy
      uses: ./.github/actions/setup-trivy

    - name: Scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        NAME: ${{ inputs.name }}
      run: |
        if [ -f "${IMAGE}" ]; then source=(--input "${IMAGE}"); else source=("${IMAGE}"); fi
        mkdir -p "${RUNNER_TEMP}/trivy"
        # Accepted findings, each with a reason, are listed in .trivyignore at the repository root
        trivy image "${source[@]}" \
          --scanners vuln \
          --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
          --format json \
          --output "${RUNNER_TEMP}/trivy/${NAME}.json"

    - name: Upload report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: trivy-${{ inputs.name }}
        path: ${{ runner.temp }}/trivy/${{ inputs.name }}.json
        retention-days: 7

    - name: Check
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        ENFORCE: ${{ inputs.enforce }}
        SEVERITIES: ${{ inputs.severities }}
      run: |
        "${GITHUB_ACTION_PATH}/check.sh" "${RUNNER_TEMP}/trivy/${NAME}.json" "${NAME}" "${SEVERITIES}" "${ENFORCE}"
