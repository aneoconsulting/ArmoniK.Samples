name: Scan image
description: >
  Scan a container image for vulnerabilities with Trivy, upload the results to
  GitHub code scanning, summarize them in the job summary and, when enforced,
  fail on fixable vulnerabilities of the blocking severities.
  Requires the `security-events: write` permission.

inputs:
  image:
    description: Image archive (a `docker save` or Jib tar) or image reference to scan
    required: true
  name:
    description: Image name, used for the report and the code scanning category
    required: true
  enforce:
    description: Fail when fixable vulnerabilities of the blocking severities are found
    required: false
    default: "false"
  severities:
    description: Comma-separated blocking severities
    required: false
    default: HIGH,CRITICAL

runs:
  using: composite
  steps:
    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: v0.76.2
        cache: true

    - name: Get date
      id: date
      shell: bash
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    # One vulnerability database download per day for all the jobs
    - name: Cache Trivy database
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ steps.date.outputs.date }}
        restore-keys: trivy-db-

    - name: Scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        NAME: ${{ inputs.name }}
      run: |
        if [ -f "${IMAGE}" ]; then source=(--input "${IMAGE}"); else source=("${IMAGE}"); fi
        # Accepted findings, each with a reason, are listed in .trivyignore at the repository root
        trivy image "${source[@]}" \
          --scanners vuln \
          --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" \
          --format json \
          --output "${RUNNER_TEMP}/trivy-${NAME}.json"
        trivy convert --format sarif --output "${RUNNER_TEMP}/trivy-${NAME}.sarif" "${RUNNER_TEMP}/trivy-${NAME}.json"

    - name: Upload to code scanning
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/trivy-${{ inputs.name }}.sarif
        category: trivy-${{ inputs.name }}

    - name: Summarize and check
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        ENFORCE: ${{ inputs.enforce }}
        SEVERITIES: ${{ inputs.severities }}
      run: |
        "${GITHUB_ACTION_PATH}/report.sh" "${RUNNER_TEMP}/trivy-${NAME}.json" "${NAME}" "${SEVERITIES}" "${ENFORCE}" >> "$GITHUB_STEP_SUMMARY"
