name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  versionning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.snapshot.outputs.version }}
      release: ${{ steps.release.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0

    - name: Remove tag locally
    # This is done so that codacy/git-version can compute the version of the images deployed on docker hub
      run: |
        git tag -d ${{ github.ref_name }}

    - name: Compute branch for codacy
    # This is the branch to give to codacy to compute the snapshot version
      id: rev
      run: |
        export CURRENT_BRANCH=$(git describe --tags)
        echo "current-branch=$CURRENT_BRANCH" >> $GITHUB_OUTPUT

    - name: Generate Snapshot Version
      id: snapshot
      uses: codacy/git-version@5cabe6920ad6a182ba6d653ee8cb5ec65b8b4cfd # 2.9.0
      with:
        minor-identifier: "feat:"
        release-branch: ${{ github.ref_name }}-pre
        dev-branch: ${{ steps.rev.outputs.current-branch }}
        prefix: v

    - name: Generate Release Version
      id: release
      uses: codacy/git-version@5cabe6920ad6a182ba6d653ee8cb5ec65b8b4cfd # 2.9.0
      with:
        minor-identifier: "feat:"
        release-branch: ${{ steps.rev.outputs.current-branch }}
        dev-branch: main
        prefix: v

    - name: Put versions in step summary
      run: |
        echo SNAPSHOT => ${{ steps.snapshot.outputs.version }} >> $GITHUB_STEP_SUMMARY
        echo RELEASE   => ${{ steps.release.outputs.version }} >> $GITHUB_STEP_SUMMARY

  buildImages:
    runs-on: ubuntu-latest
    # Image jobs: keyless signing (OIDC token)
    permissions:
      contents: read
      id-token: write
    needs:
      - versionning
    env:
      VERSION: ${{ needs.versionning.outputs.version }}
      RELEASE: ${{ needs.versionning.outputs.release }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - img : dockerhubaneo/armonik_demo_helloworld_worker
          path : ./csharp/native/HelloWorld/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_helloworld_client
          path : ./csharp/native/HelloWorld/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_multipleresults_worker
          path: ./csharp/native/MultipleResults/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_multipleresults_client
          path : ./csharp/native/MultipleResults/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_subtasking_worker
          path: ./csharp/native/SubTasking/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_subtasking_client
          path : ./csharp/native/SubTasking/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_linearsubtasking_worker
          path: ./csharp/native/LinearSubTasking/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_linearsubtasking_client
          path : ./csharp/native/LinearSubTasking/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_dynamicsubmission_worker
          path: ./csharp/native/DynamicSubmission/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_dynamicsubmission_client
          path : ./csharp/native/DynamicSubmission/Client/Dockerfile
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.ref }}
        submodules: true
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: login
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        username: ${{ secrets.DOCKER_HUB_LOGIN }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: platforms
      run: echo ${{ steps.buildx.outputs.platforms }}

    - name: Image name
      id: name
      run: echo "name=$(basename '${{ matrix.img }}')" >> $GITHUB_OUTPUT

    # The amd64 image is scanned before anything is pushed; the arm64 image has the same packages
    - name: Build for scan
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        file: ${{ matrix.path }}
        context: ./csharp/native
        platforms: linux/amd64
        load: true
        tags: ${{ steps.name.outputs.name }}:scan

    - name: Scan
      uses: ./.github/actions/scan-image
      with:
        image: ${{ steps.name.outputs.name }}:scan
        name: ${{ steps.name.outputs.name }}
        enforce: true

    - name: Build and push
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        file: ${{ matrix.path }}
        context: ./csharp/native
        platforms: |
          linux/arm64
          linux/amd64
        push: true
        sbom: true
        provenance: mode=max
        tags: |
            ${{ matrix.img }}:${{ needs.versionning.outputs.release }}
            ${{ matrix.img }}:latest

    - name: Sign
      uses: ./.github/actions/sign-image
      with:
        image: ${{ matrix.img }}
        digest: ${{ steps.push.outputs.digest }}

  buildJavaImages:
    runs-on: ubuntu-latest
    # Image jobs: keyless signing (OIDC token)
    permissions:
      contents: read
      id-token: write
    needs:
      - versionning
    env:
      RELEASE: ${{ needs.versionning.outputs.release }}
    strategy:
      fail-fast: true
      matrix:
        worker:
          - hello-world-worker
          - sum-worker
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.ref }}

    - name: Setup Java and Maven
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: temurin
        java-version: '17'
        cache: 'maven'
        cache-dependency-path: 'java/workers/${{ matrix.worker }}/pom.xml'

    - name: login
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        username: ${{ secrets.DOCKER_HUB_LOGIN }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    # The amd64 image is scanned before anything is pushed; the arm64 image has the same packages
    - name: Build for scan
      working-directory: java/workers/${{ matrix.worker }}
      run: |
        ./mvnw -B compile jar:jar jib:buildTar \
          -Djib.to.image=armonik_demo_java_${{ matrix.worker }}:scan \
          -Djib.from.platforms=linux/amd64

    - name: Scan
      uses: ./.github/actions/scan-image
      with:
        image: java/workers/${{ matrix.worker }}/target/jib-image.tar
        name: armonik_demo_java_${{ matrix.worker }}
        enforce: true

    - name: Build and push
      id: push
      working-directory: java/workers/${{ matrix.worker }}
      run: |
        ./mvnw -B compile jar:jar jib:build \
          -Djib.to.image=dockerhubaneo/armonik_demo_java_${{ matrix.worker }}:${RELEASE} \
          -Djib.to.tags=latest \
          -Djib.from.platforms=linux/amd64,linux/arm64
        echo "digest=$(cat target/jib-image.digest)" >> $GITHUB_OUTPUT

    # Jib images are not built by BuildKit: the SBOM is generated with Syft and attached with cosign
    - name: Sign
      uses: ./.github/actions/sign-image
      with:
        image: dockerhubaneo/armonik_demo_java_${{ matrix.worker }}
        digest: ${{ steps.push.outputs.digest }}
        sbom: true

  buildCppImages:
    runs-on: ubuntu-latest
    # Image jobs: keyless signing (OIDC token)
    permissions:
      contents: read
      id-token: write
    needs:
      - versionning
    env:
      RELEASE: ${{ needs.versionning.outputs.release }}
    strategy:
      fail-fast: true
      matrix:
        role: [client, worker]
        demo:
          - dir: HelloWorldAPI
            distro: ubi8
          - dir: HelloWorldAPI
            distro: debian
          - dir: HelloWorldSDK
            distro: ubi8
          - dir: HelloWorldSDK
            distro: debian
          - dir: HelloWorldC
            distro: ''
          - dir: ChainedArithmetic
            distro: ''
          - dir: StaticWorker
            distro: ''
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.ref }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: login
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        username: ${{ secrets.DOCKER_HUB_LOGIN }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Compute build parameters
      id: params
      run: |
        # Every variable of versions.env (versions and package checksums) as a build argument
        {
          echo "build-args<<EOF"
          grep -E '^[A-Z0-9_]+=' cpp/versions.env
          echo "EOF"
        } >> $GITHUB_OUTPUT
        IMAGE="dockerhubaneo/armonik_demo_cpp_$(echo '${{ matrix.demo.dir }}' | tr '[:upper:]' '[:lower:]')_${{ matrix.role }}"
        DISTRO="${{ matrix.demo.distro }}"
        echo "dockerfile=Dockerfile${DISTRO:+.${DISTRO}}" >> $GITHUB_OUTPUT
        echo "image=${IMAGE}" >> $GITHUB_OUTPUT
        echo "name=$(basename "${IMAGE}")${DISTRO:+-${DISTRO}}" >> $GITHUB_OUTPUT
        {
          echo "tags<<EOF"
          echo "${IMAGE}:${RELEASE}${DISTRO:+-${DISTRO}}"
          echo "${IMAGE}:latest${DISTRO:+-${DISTRO}}"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Build for scan
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ./cpp/${{ matrix.demo.dir }}/${{ matrix.role }}
        file: ./cpp/${{ matrix.demo.dir }}/${{ matrix.role }}/${{ steps.params.outputs.dockerfile }}
        platforms: linux/amd64
        build-args: ${{ steps.params.outputs.build-args }}
        load: true
        tags: ${{ steps.params.outputs.name }}:scan

    - name: Scan
      uses: ./.github/actions/scan-image
      with:
        image: ${{ steps.params.outputs.name }}:scan
        name: ${{ steps.params.outputs.name }}
        enforce: true

    - name: Build and push
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ./cpp/${{ matrix.demo.dir }}/${{ matrix.role }}
        file: ./cpp/${{ matrix.demo.dir }}/${{ matrix.role }}/${{ steps.params.outputs.dockerfile }}
        platforms: linux/amd64
        build-args: ${{ steps.params.outputs.build-args }}
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ steps.params.outputs.tags }}

    - name: Sign
      uses: ./.github/actions/sign-image
      with:
        image: ${{ steps.params.outputs.image }}
        digest: ${{ steps.push.outputs.digest }}

  # Summary of every image scan, CSV of every vulnerability and one code scanning upload
  trivyReport:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - buildImages
      - buildJavaImages
      - buildCppImages
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download scan reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: trivy-*
          path: trivy/reports
          merge-multiple: true

      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy

      - name: Report
        run: python3 .github/scripts/trivy-report.py trivy/reports "$GITHUB_STEP_SUMMARY" trivy/out

      - name: Upload CSV
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-reports
          path: trivy/out/vulnerabilities.csv

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy/out/images.sarif
          category: trivy-images

  buildProjects:
    runs-on: ubuntu-latest
    needs:
      - versionning
    env:
      GENRELEASE: ${{ needs.versionning.outputs.release }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.ref }}
        submodules: true

    - name: Build the package
      run: |
        dotnet build AllSamples.sln -c Release -p:Version=$(echo $GENRELEASE | sed 's/^.//')
