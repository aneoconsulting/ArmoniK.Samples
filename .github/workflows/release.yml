name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  versionning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.snapshot.outputs.version }}
      release: ${{ steps.release.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0

    - name: Remove tag locally
    # This is done so that codacy/git-version can compute the version of the images deployed on docker hub
      run: |
        git tag -d ${{ github.ref_name }}

    - name: Compute branch for codacy
    # This is the branch to give to codacy to compute the snapshot version
      id: rev
      run: |
        export CURRENT_BRANCH=$(git describe --tags)
        echo "current-branch=$CURRENT_BRANCH" >> $GITHUB_OUTPUT

    - name: Generate Snapshot Version
      id: snapshot
      uses: codacy/git-version@e81d6fdad74f9e114420d69ca8b47658f1182afb # 2.8.7
      with:
        minor-identifier: "feat:"
        release-branch: ${{ github.ref_name }}-pre
        dev-branch: ${{ steps.rev.outputs.current-branch }}
        prefix: v

    - name: Generate Release Version
      id: release
      uses: codacy/git-version@e81d6fdad74f9e114420d69ca8b47658f1182afb # 2.8.7
      with:
        minor-identifier: "feat:"
        release-branch: ${{ steps.rev.outputs.current-branch }}
        dev-branch: main
        prefix: v

    - name: Put versions in step summary
      run: |
        echo SNAPSHOT => ${{ steps.snapshot.outputs.version }} >> $GITHUB_STEP_SUMMARY
        echo RELEASE   => ${{ steps.release.outputs.version }} >> $GITHUB_STEP_SUMMARY

  buildImages:
    runs-on: ubuntu-latest
    needs:
      - versionning
    env:
      VERSION: ${{ needs.versionning.outputs.version }}
      RELEASE: ${{ needs.versionning.outputs.release }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - img : dockerhubaneo/armonik_demo_helloworld_worker
          path : ./csharp/native/HelloWorld/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_helloworld_client
          path : ./csharp/native/HelloWorld/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_multipleresults_worker
          path: ./csharp/native/MultipleResults/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_multipleresults_client
          path : ./csharp/native/MultipleResults/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_subtasking_worker
          path: ./csharp/native/SubTasking/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_subtasking_client
          path : ./csharp/native/SubTasking/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_linearsubtasking_worker
          path: ./csharp/native/LinearSubTasking/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_linearsubtasking_client
          path : ./csharp/native/LinearSubTasking/Client/Dockerfile
        - img : dockerhubaneo/armonik_demo_dynamicsubmission_worker
          path: ./csharp/native/DynamicSubmission/Worker/Dockerfile
        - img : dockerhubaneo/armonik_demo_dynamicsubmission_client
          path : ./csharp/native/DynamicSubmission/Client/Dockerfile
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.ref }}
        submodules: true
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: login
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        username: ${{ secrets.DOCKER_HUB_LOGIN }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: platforms
      run: echo ${{ steps.buildx.outputs.platforms }}

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        file: ${{ matrix.path }}
        context: ./csharp/native
        platforms: |
          linux/arm64
          linux/amd64
        push: true
        tags: |
            ${{ matrix.img }}:${{ needs.versionning.outputs.release }}
            ${{ matrix.img }}:latest

  buildJavaImages:
    runs-on: ubuntu-latest
    needs:
      - versionning
    env:
      RELEASE: ${{ needs.versionning.outputs.release }}
    strategy:
      fail-fast: true
      matrix:
        worker:
          - hello-world-worker
          - sum-worker
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.ref }}

    - name: Setup Java and Maven
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: 'maven'
        cache-dependency-path: 'java/workers/${{ matrix.worker }}/pom.xml'

    - name: login
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        username: ${{ secrets.DOCKER_HUB_LOGIN }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push
      working-directory: java/workers/${{ matrix.worker }}
      run: |
        ./mvnw -B compile jar:jar jib:build \
          -Djib.to.image=dockerhubaneo/armonik_demo_java_${{ matrix.worker }}:${RELEASE} \
          -Djib.to.tags=latest \
          -Djib.from.platforms=linux/amd64,linux/arm64

  buildCppImages:
    runs-on: ubuntu-latest
    needs:
      - versionning
    env:
      RELEASE: ${{ needs.versionning.outputs.release }}
    strategy:
      fail-fast: true
      matrix:
        role: [client, worker]
        demo:
          - dir: HelloWorldAPI
            distro: ubi8
          - dir: HelloWorldAPI
            distro: debian
          - dir: HelloWorldSDK
            distro: ubi8
          - dir: HelloWorldSDK
            distro: debian
          - dir: HelloWorldC
            distro: ''
          - dir: ChainedArithmetic
            distro: ''
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.ref }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: login
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        username: ${{ secrets.DOCKER_HUB_LOGIN }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Compute build parameters
      id: params
      run: |
        VERSIONS=$(curl -fsS https://raw.githubusercontent.com/aneoconsulting/ArmoniK/main/versions.tfvars.json)
        echo "api-version=$(echo "${VERSIONS}" | jq -r '.armonik_versions.api')" >> $GITHUB_OUTPUT
        echo "sdk-version=$(echo "${VERSIONS}" | jq -r '.armonik_versions.extcpp')" >> $GITHUB_OUTPUT
        IMAGE="dockerhubaneo/armonik_demo_cpp_$(echo '${{ matrix.demo.dir }}' | tr '[:upper:]' '[:lower:]')_${{ matrix.role }}"
        DISTRO="${{ matrix.demo.distro }}"
        echo "dockerfile=Dockerfile${DISTRO:+.${DISTRO}}" >> $GITHUB_OUTPUT
        {
          echo "tags<<EOF"
          echo "${IMAGE}:${RELEASE}${DISTRO:+-${DISTRO}}"
          echo "${IMAGE}:latest${DISTRO:+-${DISTRO}}"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ./cpp/${{ matrix.demo.dir }}/${{ matrix.role }}
        file: ./cpp/${{ matrix.demo.dir }}/${{ matrix.role }}/${{ steps.params.outputs.dockerfile }}
        platforms: linux/amd64
        build-args: |
          API_VERSION=${{ steps.params.outputs.api-version }}
          SDK_VERSION=${{ steps.params.outputs.sdk-version }}
        push: true
        tags: ${{ steps.params.outputs.tags }}

  buildProjects:
    runs-on: ubuntu-latest
    needs:
      - versionning
    env:
      GENRELEASE: ${{ needs.versionning.outputs.release }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.ref }}
        submodules: true

    - name: Build the package
      run: |
        dotnet build AllSamples.sln -c Release -p:Version=$(echo $GENRELEASE | sed 's/^.//')
