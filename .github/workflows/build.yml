name: DeployTest

on:
  push:

jobs:
  formatCsharp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        solution:
          - AllSamples.sln
          - csharp/native/Demo.sln
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        submodules: true

    - name: Install .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        dotnet-version: 10.0.403

    - name: Install ReSharper
      run: |
        dotnet tool install -g JetBrains.ReSharper.GlobalTools --version 2025.1.2

    - name: Restore
      run: |
        dotnet restore ${{ matrix.solution }}

    - name: Reformat
      run: |
        jb cleanupcode ${{ matrix.solution }}

    - name: Check Diff
      id: check-diff
      run: |
        DIFF="$(git diff --name-only)"

        if [ -z "$DIFF" ]; then
          echo "OK: Format is clean"
        else
          echo "Error: Format was not clean"
          echo "List of files:"
          echo "$DIFF"
          git diff
          exit 1
        fi
    - name: Generate patch
      if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
      run: |
        git diff > patch-csharp.diff
        
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
      with:
        name: patch-csharp
        path: ./patch-csharp.diff
        
  buildProjects:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.head_ref }}

    - name: Install .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        dotnet-version: 10.0.403

    - name: Build the package
      run: |
        dotnet build AllSamples.sln

  buildCppWindowsClient:
    name: Build C++ StaticWorker client (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.ref }}

    - name: Read SDK version
      id: sdk
      shell: pwsh
      run: |
        $ref = (Select-String -Path cpp/versions.env -Pattern '^SDK_VERSION=(\S+)').Matches[0].Groups[1].Value
        "ref=$ref" >> $env:GITHUB_OUTPUT

    - name: Checkout ArmoniK.Extensions.Cpp
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        repository: aneoconsulting/ArmoniK.Extensions.Cpp
        ref: ${{ steps.sdk.outputs.ref }}
        path: sdk

    # Prebuilt MSVC binaries of gRPC and its dependencies from conda-forge
    - name: Install dependencies
      id: deps
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        environment-file: sdk/tools/windows/environment.yml
        init-shell: none
        cache-downloads: true

    # Same script as documented in cpp/StaticWorker/README.md, with the checkout and environment above
    - name: Build
      shell: pwsh
      run: >
        ./cpp/StaticWorker/windows-client/build.ps1
        -SdkSource "${{ github.workspace }}\sdk"
        -DepsPrefix "${{ steps.deps.outputs.environment-path }}"
        -WorkDir "${{ runner.temp }}\akb"

    - name: Check output
      shell: pwsh
      run: |
        $dist = 'cpp/StaticWorker/windows-client/dist'
        foreach ($f in 'ArmoniK.Samples.Cpp.StaticWorker.Client.exe', 'appsettings.json') {
          if (-not (Test-Path "$dist/$f")) { throw "$f missing from $dist" }
        }
        Get-ChildItem $dist | Format-Table Name, Length

  setupDemoNames:
    runs-on: ubuntu-latest
    outputs:
      csharp-demo-names: ${{ steps.set-csharp-demos.outputs.csharp-demo-names }}
      csharp-demo-dirs: ${{ steps.set-csharp-demos.outputs.csharp-demo-dirs }}
      csharp-demo-names-to-sdk-dir: ${{ steps.set-csharp-demos.outputs.csharp-demo-names-to-sdk-dir }}
      cpp-demo-names: ${{ steps.set-cpp-demos.outputs.cpp-demo-names }}
      cpp-demo-dirs: ${{ steps.set-cpp-demos.outputs.cpp-demo-dirs }}
      java-demo-names: ${{ steps.set-java-demos.outputs.java-demo-names }}
      java-demo-worker-dirs: ${{ steps.set-java-demos.outputs.java-demo-worker-dirs }}
      java-demo-names-to-worker: ${{ steps.set-java-demos.outputs.java-demo-names-to-worker }}
      java-demo-names-to-library: ${{ steps.set-java-demos.outputs.java-demo-names-to-library }}
    steps:
      - name: CSharp demos
        id: set-csharp-demos
        run: |
          CSHARP_DEMO_DIRS='["HelloWorld","MultipleResults","SubTasking","LinearSubTasking","DynamicSubmission"]'
          # Samples under csharp/sdk: worker library loaded by the dynamic worker, no sample images
          CSHARP_SDK_DEMO_DIRS='["SubTasking"]'
          CSHARP_DEMO_NAMES=$(jq -nc --argjson native "${CSHARP_DEMO_DIRS}" --argjson sdk "${CSHARP_SDK_DEMO_DIRS}" '($native | map(ascii_downcase)) + ($sdk | map("sdk" + ascii_downcase))')
          CSHARP_DEMO_NAMES_TO_SDK_DIR=$(echo "${CSHARP_SDK_DEMO_DIRS}" | jq -c 'map({("sdk" + ascii_downcase): .})')
          echo "csharp-demo-dirs=${CSHARP_DEMO_DIRS}" >> $GITHUB_OUTPUT
          echo "csharp-demo-names=${CSHARP_DEMO_NAMES}" >> $GITHUB_OUTPUT
          echo "csharp-demo-names-to-sdk-dir=${CSHARP_DEMO_NAMES_TO_SDK_DIR}" >> $GITHUB_OUTPUT

      - name: Cpp demos
        id: set-cpp-demos
        run: |
          CPP_DEMO_DIRS='["HelloWorldAPI","HelloWorldSDK","HelloWorldC","ChainedArithmetic","StaticWorker"]'
          CPP_DEMO_NAMES=$(echo "${CPP_DEMO_DIRS}" | jq -c 'map(ascii_downcase)')
          echo "cpp-demo-dirs=${CPP_DEMO_DIRS}" >> $GITHUB_OUTPUT
          echo "cpp-demo-names=${CPP_DEMO_NAMES}" >> $GITHUB_OUTPUT

      - name: Java demos
        id: set-java-demos
        run: |
          JAVA_DEMO_WORKER_DIRS='["workers/hello-world-worker","workers/sum-worker"]'
          JAVA_DEMO_NAMES='["HelloWorld","SharedBlob","TaskDependencies","RangeSum"]'
          JAVA_DEMO_NAMES_TO_WORKER='[{"HelloWorld":"hello-world-worker"},{"SharedBlob":"sum-worker"},{"TaskDependencies":"sum-worker"}]'
          # Demos running a worker library on the dynamic Java worker instead of a sample worker image
          JAVA_DEMO_NAMES_TO_LIBRARY='[{"RangeSum":"range-sum-library"}]'
          echo "java-demo-worker-dirs=${JAVA_DEMO_WORKER_DIRS}" >> $GITHUB_OUTPUT
          echo "java-demo-names=${JAVA_DEMO_NAMES}" >> $GITHUB_OUTPUT
          echo "java-demo-names-to-worker=${JAVA_DEMO_NAMES_TO_WORKER}" >> $GITHUB_OUTPUT
          echo "java-demo-names-to-library=${JAVA_DEMO_NAMES_TO_LIBRARY}" >> $GITHUB_OUTPUT

  # Sample images are not pushed: they are saved as workflow artifacts and imported into k3s by the test jobs
  buildCSharpImages:
    runs-on: ubuntu-latest
    needs:
      - buildProjects
      - setupDemoNames
    strategy:
      fail-fast: true
      matrix:
        demodir: ${{ fromJson(needs.setupDemoNames.outputs.csharp-demo-dirs) }}
        role: [Client, Worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: |
          IMAGE_NAME="armonik_demo_$(echo '${{ matrix.demodir }}' | tr '[:upper:]' '[:lower:]')_$(echo '${{ matrix.role }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          docker build \
            -t ${IMAGE_NAME}:ci \
            -f ./csharp/native/${{ matrix.demodir }}/${{ matrix.role }}/Dockerfile \
            csharp/native/
          mkdir -p images
          docker save ${IMAGE_NAME}:ci -o images/${IMAGE_NAME}.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ env.IMAGE_NAME }}
          path: images/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  buildCppImages:
    runs-on: ubuntu-latest
    needs:
      - setupDemoNames
    strategy:
      fail-fast: true
      matrix:
        demodir: ${{ fromJson(needs.setupDemoNames.outputs.cpp-demo-dirs) }}
        role: [client, worker]
        distro: ['']
        include:
          - demodir: HelloWorldAPI
            role: client
            distro: ubi8
          - demodir: HelloWorldAPI
            role: worker
            distro: ubi8
          - demodir: HelloWorldAPI
            role: client
            distro: debian
          - demodir: HelloWorldAPI
            role: worker
            distro: debian
          - demodir: HelloWorldSDK
            role: client
            distro: ubi8
          - demodir: HelloWorldSDK
            role: worker
            distro: ubi8
          - demodir: HelloWorldSDK
            role: client
            distro: debian
          - demodir: HelloWorldSDK
            role: worker
            distro: debian
        exclude:
          - demodir: HelloWorldAPI
            distro: ''
          - demodir: HelloWorldSDK
            distro: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: |
          source cpp/versions.env
          IMAGE_NAME="armonik_demo_cpp_$(echo '${{ matrix.demodir }}' | tr '[:upper:]' '[:lower:]')_${{ matrix.role }}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          DEMO_DIR="${{ matrix.demodir }}"
          DEMO_DIR="${DEMO_DIR/HelloWorldSDK_C/HelloWorldC}"
          DISTRO="${{ matrix.distro }}"
          if [ -n "${DISTRO}" ]; then
            DOCKERFILE="Dockerfile.${DISTRO}"
            IMAGE_TAG="ci-${DISTRO}"
          else
            DOCKERFILE="Dockerfile"
            IMAGE_TAG="ci"
          fi
          ARCHIVE="${IMAGE_NAME}${DISTRO:+-${DISTRO}}"
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV
          docker build \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            -f ./cpp/${DEMO_DIR}/${{ matrix.role }}/${DOCKERFILE} \
            --build-arg="API_VERSION=${API_VERSION}" \
            --build-arg="SDK_VERSION=${SDK_VERSION}" \
            cpp/${DEMO_DIR}/${{ matrix.role }}/
          mkdir -p images
          docker save ${IMAGE_NAME}:${IMAGE_TAG} -o images/${ARCHIVE}.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ env.ARCHIVE }}
          path: images/${{ env.ARCHIVE }}.tar
          retention-days: 1

  buildJavaImages:
    runs-on: ubuntu-latest
    needs:
      - setupDemoNames
    strategy:
      fail-fast: true
      matrix:
        demodir: ${{ fromJson(needs.setupDemoNames.outputs.java-demo-worker-dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java and Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: 'java/${{ matrix.demodir }}/pom.xml'

      - name: Build Docker image
        run: |
          demodir="${{ matrix.demodir }}" && stripped=${demodir#*/}
          IMAGE_NAME="armonik_demo_java_${stripped}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          (cd java/${{ matrix.demodir }} && ./mvnw package -Djib.to.image=${IMAGE_NAME}:ci)
          mkdir -p images
          docker save ${IMAGE_NAME}:ci -o images/${IMAGE_NAME}.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ env.IMAGE_NAME }}
          path: images/${{ env.IMAGE_NAME }}.tar
          retention-days: 1

  CSharpSamples:
    runs-on: ubuntu-latest
    needs:
      - buildCSharpImages
      - setupDemoNames
    env:
      # Dynamic worker image of ArmoniK.Extensions.CSharp for SDK demos; must match the SDK version of the samples
      CSHARP_DYNAMIC_WORKER_VERSION: 0.23.1
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJson(needs.setupDemoNames.outputs.csharp-demo-names) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true

      - name: Checkout Infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
            repository: aneoconsulting/ArmoniK
            path: infra

      - name: Figure out correct worker
        run: |
          DEMO2SDKDIR='${{ needs.setupDemoNames.outputs.csharp-demo-names-to-sdk-dir }}'
          sdk_dir=$(echo $DEMO2SDKDIR | jq -r --arg name "${{ matrix.demo }}" 'map(select(.[$name])) | .[0][$name] // empty')
          if [ -n "$sdk_dir" ]; then
            echo SDK_DIR=$sdk_dir >> $GITHUB_ENV
            echo WORKER_IMAGE=dockerhubaneo/armonik-dynamic-dotnet-worker >> $GITHUB_ENV
            echo WORKER_VERSION=$CSHARP_DYNAMIC_WORKER_VERSION >> $GITHUB_ENV
          else
            echo WORKER_IMAGE=armonik_demo_${{ matrix.demo }}_worker >> $GITHUB_ENV
            echo WORKER_VERSION=ci >> $GITHUB_ENV
          fi

      - name: Download sample images
        if: ${{ env.SDK_DIR == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: image-armonik_demo_${{ matrix.demo }}_*
          path: images
          merge-multiple: true

      - name: Load sample images
        if: ${{ env.SDK_DIR == '' }}
        run: |
          # k3s does not use the docker image store: images are loaded in both
          for archive in images/*.tar; do
            docker load -i "${archive}"
            sudo k3s ctr images import "${archive}"
          done

      - name: Deploy
        id: deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          override-compute: true
          override-worker-version: ${{ env.WORKER_VERSION }}
          override-worker-image: ${{ env.WORKER_IMAGE }}
          override-worker-partition: ${{ matrix.demo }}
          log-suffix: ${{ matrix.demo }}

      - name: Install .NET Core
        if: ${{ env.SDK_DIR != '' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.403

      - name: Run SDK Demo
        if: ${{ env.SDK_DIR != '' }}
        timeout-minutes: 10
        working-directory: csharp/sdk/${{ env.SDK_DIR }}
        run: |
          export Grpc__EndPoint=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          dotnet publish -c Release ${{ env.SDK_DIR }}.Worker
          dotnet run --project ${{ env.SDK_DIR }}.Client -- --Partition ${{ matrix.demo }}

      - name: Run Demo Client
        if: ${{ env.SDK_DIR == '' }}
        timeout-minutes: 10
        run: |
          export Grpc__Endpoint=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          docker run --rm armonik_demo_${{ matrix.demo }}_client:ci --endpoint $Grpc__Endpoint --partition ${{ matrix.demo }}

  testInfraWorker:
    needs:
      - buildProjects
    strategy:
      matrix:
        scenario:
          - --nbTask 224  --nbInputBytes 4029815 --nbOutputBytes 226016  --workLoadTimeInMs 10

      fail-fast: false
    runs-on: ubuntu-latest
    env:
      ARMONIK_SHARED_HOST_PATH: ${{ github.workspace }}/infra/infrastructure/quick-deploy/localhost/all-in-one/data/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          docker: true
          terraform: true
          k3s: true
          aws: true

      - name: Checkout Infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: aneoconsulting/ArmoniK
          path: infra

      - name: Deploy
        id: deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          override-compute: true
          override-worker-version: 0.19.3
          override-worker-image: dockerhubaneo/armonik_worker_dll
          override-worker-partition: default
          shared-data-folder: ${{ env.ARMONIK_SHARED_HOST_PATH }}
          log-suffix: infraWorker

      - name: Run UnifiedAPI
        timeout-minutes: 15
        run: |
          cd tools/tests
          bash -x ./unified_api.sh

      - name: Run StressTests
        timeout-minutes: 15
        run: |
          cd tools/tests
          bash -x ./stress-tests.sh -- stressTest ${{ matrix.scenario }}
      - name: Copy logs
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/armoniklogs
          sudo find /var/log/pods/ -maxdepth 1 -iname 'armonik_*' -exec cp -rL '{}' /tmp/armoniklogs/ ';'
          sudo chown $USER -R /tmp/armoniklogs
          find /tmp/armoniklogs -name "*.log"

      - name: Store logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Logs Worker
          path: /tmp/armoniklogs/**/*.log
          retention-days: 5
          
      - name: Destroy deployment
        if: success() || failure()
        uses: aneoconsulting/ArmoniK.Action.Deploy/destroy@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost

  CppSamples:
    runs-on: ubuntu-latest
    needs:
      - buildCppImages
      - setupDemoNames
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJson(needs.setupDemoNames.outputs.cpp-demo-names) }}
        distro: ['']
        include:
          - demo: helloworldapi
            distro: ubi8
          - demo: helloworldapi
            distro: debian
          - demo: helloworldsdk
            distro: ubi8
          - demo: helloworldsdk
            distro: debian
        exclude:
          - demo: helloworldapi
            distro: ''
          - demo: helloworldsdk
            distro: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true

      - name: Checkout Infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
            repository: aneoconsulting/ArmoniK
            path: infra

      - name: Download sample images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ format('image-armonik_demo_cpp_{0}_*{1}', matrix.demo, matrix.distro && format('-{0}', matrix.distro) || '') }}
          path: images
          merge-multiple: true

      - name: Load sample images
        run: |
          # k3s does not use the docker image store: images are loaded in both
          for archive in images/*.tar; do
            docker load -i "${archive}"
            sudo k3s ctr images import "${archive}"
          done

      - name: Prepare SDK sample
        if: ${{ !contains(matrix.demo, 'api') && matrix.demo != 'staticworker' }}
        run: |
          case "${{ matrix.demo }}" in
            helloworldc)
              SO_FILE="libArmoniK.Samples.C.Hello.Worker.so"
              DEST=${{ github.workspace }}/infra/infrastructure/quick-deploy/localhost/all-in-one/data
              ;;
            chainedarithmetic)
              # .so is uploaded by the client as a blob; copy it to a local dir the client container can mount.
              SO_FILE="libArmoniK.Samples.Cpp.ChainedArithmetic.Worker.so"
              DEST=/tmp/so-libs
              mkdir -p ${DEST}
              ;;
            *)
              SO_FILE="libArmoniK.Samples.Cpp.Hello.SDK.Worker.so"
              DEST=${{ github.workspace }}/infra/infrastructure/quick-deploy/localhost/all-in-one/data
              ;;
          esac
          DISTRO="${{ matrix.distro }}"
          WORKER_TAG="ci${DISTRO:+-${DISTRO}}"
          docker create --name so_exporter armonik_demo_cpp_${{ matrix.demo }}_worker:${WORKER_TAG}
          docker cp so_exporter:app/${SO_FILE} ${DEST}
          docker rm so_exporter
          grep '^SDK_VERSION=' cpp/versions.env >> $GITHUB_ENV
          echo "SO_FILE=${SO_FILE}" >> $GITHUB_ENV

      - name: Deploy
        id: deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          override-compute: true
          # helloworldapi and staticworker run their own worker image; the other demos run the SDK's DynamicWorker
          override-worker-version: ${{ (contains(matrix.demo, 'api') || matrix.demo == 'staticworker') && (matrix.distro && format('ci-{0}', matrix.distro) || 'ci') || format('{0}-ubuntu', env.SDK_VERSION) }}
          override-worker-image: ${{ (contains(matrix.demo, 'api') || matrix.demo == 'staticworker') && format('armonik_demo_cpp_{0}_worker', matrix.demo) || 'dockerhubaneo/armonik-sdk-cpp-dynamicworker' }}
          override-worker-partition: ${{ matrix.demo }}
          log-suffix: ${{ matrix.distro && format('{0}-{1}', matrix.demo, matrix.distro) || matrix.demo }}

      - name: Run Demo Client
        timeout-minutes: 10
        run: |
          export Grpc__Endpoint=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          DISTRO="${{ matrix.distro }}"
          CLIENT_TAG="ci${DISTRO:+-${DISTRO}}"
          if [ "${{ matrix.demo }}" = "chainedarithmetic" ]; then
            docker run --rm \
              -v /tmp/so-libs:/so-libs \
              -e GrpcClient__Endpoint="${Grpc__Endpoint}" \
              -e PartitionId="${{ matrix.demo }}" \
              -e Worker__LibraryPath="/so-libs/${SO_FILE}" \
              armonik_demo_cpp_${{ matrix.demo }}_client:${CLIENT_TAG}
          else
            docker run --rm \
              -e GrpcClient__Endpoint="${Grpc__Endpoint}" \
              -e PartitionId="${{ matrix.demo }}" \
              armonik_demo_cpp_${{ matrix.demo }}_client:${CLIENT_TAG}
          fi

  JavaSamples:
    runs-on: ubuntu-latest
    needs:
      - buildJavaImages
      - setupDemoNames
    env:
      # Dynamic worker image of ArmoniK.Extensions.Java for library demos; must match the SDK version of the libraries
      JAVA_DYNAMIC_WORKER_VERSION: 0.2.0
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJson(needs.setupDemoNames.outputs.java-demo-names) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true

      - name: Checkout Infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
            repository: aneoconsulting/ArmoniK
            path: infra

      - name: Figure out correct worker
        id: get-worker
        run: |
          DEMO2WORKER='${{ needs.setupDemoNames.outputs.java-demo-names-to-worker }}'
          DEMO2LIBRARY='${{ needs.setupDemoNames.outputs.java-demo-names-to-library }}'
          worker=$(echo $DEMO2WORKER | jq -r --arg name "${{ matrix.demo }}" 'map(select(.[$name])) | .[0][$name] // empty')
          library=$(echo $DEMO2LIBRARY | jq -r --arg name "${{ matrix.demo }}" 'map(select(.[$name])) | .[0][$name] // empty')
          if [ -n "$library" ]; then
            echo WORKER_LIBRARY=$library >> $GITHUB_ENV
            echo WORKER_IMAGE=dockerhubaneo/armonik-dynamic-java-worker >> $GITHUB_ENV
            echo WORKER_VERSION=$JAVA_DYNAMIC_WORKER_VERSION >> $GITHUB_ENV
          else
            echo WORKER_IMAGE=armonik_demo_java_$worker >> $GITHUB_ENV
            echo WORKER_VERSION=ci >> $GITHUB_ENV
          fi
          echo PARTITION_NAME=$(echo '${{ matrix.demo }}' | tr '[:upper:]' '[:lower:]') >> $GITHUB_ENV

      - name: Download sample images
        if: ${{ env.WORKER_LIBRARY == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-${{ env.WORKER_IMAGE }}
          path: images

      - name: Load sample images
        if: ${{ env.WORKER_LIBRARY == '' }}
        run: |
          # k3s does not use the docker image store: images are loaded in both
          for archive in images/*.tar; do
            docker load -i "${archive}"
            sudo k3s ctr images import "${archive}"
          done
          
      - name: Deploy
        id: deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          override-compute: true
          override-worker-socket: tcp
          override-worker-version: ${{ env.WORKER_VERSION }}
          override-worker-image: ${{ env.WORKER_IMAGE }}
          override-worker-partition: ${{ env.PARTITION_NAME }}
          log-suffix: ${{ matrix.demo }}

      - name: Setup Java and Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: |
            java/client/pom.xml
            java/worker-libraries/*/pom.xml

      - name: Build Worker Library
        if: ${{ env.WORKER_LIBRARY != '' }}
        working-directory: java/worker-libraries/${{ env.WORKER_LIBRARY }}
        run: mvn -B -ntp package

      - name: Run Demo Client
        timeout-minutes: 10
        run: |
          cd java/client
          PARTITION_NAME=$(echo '${{ matrix.demo }}' | tr '[:upper:]' '[:lower:]')
          ./mvnw compile exec:java -D"fr.aneo.armonik.client.samples.partition=$PARTITION_NAME" -Dexec.mainClass="fr.aneo.armonik.client.samples.${{ matrix.demo }}"

  CppInterop:
    runs-on: ubuntu-latest
    needs:
      - buildCppImages
      - setupDemoNames
    strategy:
      fail-fast: false
      matrix:
        demo: [javaClientCppWorker, csharpClientCppWorker]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true

      - name: Checkout Infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
            repository: aneoconsulting/ArmoniK
            path: infra

      - name: Download sample images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-armonik_demo_cpp_chainedarithmetic_worker
          path: images

      - name: Prepare SDK sample
        run: |
          SO_FILE="libArmoniK.Samples.Cpp.ChainedArithmetic.Worker.so"
          DEST=/tmp/so-libs
          mkdir -p ${DEST}
          docker load -i images/armonik_demo_cpp_chainedarithmetic_worker.tar
          docker create --name so_exporter armonik_demo_cpp_chainedarithmetic_worker:ci
          docker cp so_exporter:app/${SO_FILE} ${DEST}
          docker rm so_exporter
          grep '^SDK_VERSION=' cpp/versions.env >> $GITHUB_ENV
          echo "SO_FILE=${SO_FILE}" >> $GITHUB_ENV
          echo "PARTITION_NAME=$(echo '${{ matrix.demo }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy
        id: deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          override-compute: true
          override-worker-version:  ${{ format('{0}-ubuntu', env.SDK_VERSION) }}
          override-worker-image: dockerhubaneo/armonik-sdk-cpp-dynamicworker
          override-worker-partition: ${{ env.PARTITION_NAME }}
          log-suffix: ${{ env.PARTITION_NAME }}

      - name: Setup Java and Maven
        if: ${{ matrix.demo == 'javaClientCppWorker' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
          cache-dependency-path: 'java/client/pom.xml'

      - name: Install .NET Core
        if: ${{ matrix.demo == 'csharpClientCppWorker' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.403

      - name: Run Java Demo Client
        if: ${{ matrix.demo == 'javaClientCppWorker' }}
        timeout-minutes: 10
        run: |
          cd java/client
          ./mvnw compile exec:java -D"fr.aneo.armonik.client.samples.partition=$PARTITION_NAME" -D"fr.aneo.armonik.client.samples.dynlib.path=/tmp/so-libs/${SO_FILE}" -Dexec.mainClass="fr.aneo.armonik.client.samples.CppDynamicLibrary"

      - name: Run C# Demo Client
        if: ${{ matrix.demo == 'csharpClientCppWorker' }}
        timeout-minutes: 10
        run: |
          export Grpc__EndPoint=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          dotnet run --project csharp/sdk/CppDynamicLibrary/CppDynamicLibrary.csproj -- \
            --LibraryPath /tmp/so-libs/${SO_FILE} \
            --Partition $PARTITION_NAME

  QuantLibSamples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Install Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true

      - name: Checkout Infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
            repository: aneoconsulting/ArmoniK
            path: infra

      - name: Build images
        run: |
          python/quantlib/build.sh all --test --tag ci
          # k3s does not use the docker image store: the worker image is imported for the partition to find it
          docker save armonik_quantlib_worker:ci | sudo k3s ctr images import -
          make -C cpp/QuantLib build_client CLIENT_IMAGE_TAG=armonik_quantlib_client_cpp:ci
          # The sample batch without its request invalid on purpose: every client must exit with 0
          mkdir -p /tmp/quantlib
          jq 'del(.requests[] | select(.id == "invalid-on-purpose"))' python/quantlib/samples/mixed_batch.json > /tmp/quantlib/batch.json

      - name: Deploy
        id: deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@923fcbd791220589afb89b3f0f5b5935eab39c63 # main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          override-compute: true
          override-worker-version: ci
          override-worker-image: armonik_quantlib_worker
          override-worker-partition: quantlib
          log-suffix: quantlib

      - name: Install .NET Core
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.x

      - name: Run Python client
        timeout-minutes: 10
        run: |
          ENDPOINT=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          docker run --rm -v /tmp/quantlib:/data/input:ro armonik_quantlib_client:ci input/batch.json \
            --endpoint "${ENDPOINT}" --partition quantlib --batch-size 3

      - name: Run C# API client
        timeout-minutes: 10
        run: |
          ENDPOINT=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          dotnet run --project csharp/native/QuantLib/Client -- /tmp/quantlib/batch.json \
            --endpoint "${ENDPOINT}" --partition quantlib --batch-size 3

      - name: Run C# SDK client
        timeout-minutes: 10
        run: |
          export Grpc__EndPoint=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          dotnet run --project csharp/sdk/QuantLib -- --Input /tmp/quantlib/batch.json --Partition quantlib --BatchSize 3

      - name: Run C++ SDK client
        timeout-minutes: 10
        run: |
          docker run --rm -v /tmp/quantlib:/app/input:ro \
            -e GrpcClient__Endpoint="$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")" \
            -e PartitionId=quantlib -e Input=input/batch.json -e BatchSize=3 \
            armonik_quantlib_client_cpp:ci
